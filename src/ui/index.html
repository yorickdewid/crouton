<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crouton</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* dark — default, dev-tool aesthetic with high contrast */
      --bg:      #1a1a1a;
      --surface: #242424;
      --surface2:#2e2e2e;
      --border:  #3d3d3d;
      --text:    #f5f5f5;
      --muted:   #888;
      --dim:     #bbb;
      --accent:  #4eee83;
      --blue:    #79b8ff;
      --warn:    #f1c40f;
      --danger:  #ff6464;
      --font: 'Berkeley Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    }

    [data-theme="light"] {
      /* paper-cream light — solarized-inspired */
      --bg:      #fdf6e3;
      --surface: #f0e9d2;
      --surface2:#e8e0c4;
      --border:  #c6bc9a;
      --text:    #2c2418;
      --muted:   #8a8170;
      --dim:     #4a4538;
      --accent:  #4a7c0f;
      --blue:    #1f5fa8;
      --warn:    #b06400;
      --danger:  #b22b1c;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg);
      position: relative;
      z-index: 10;
    }

    header h1 {
      font-size: 13px;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    header .sep { color: var(--border); margin: 0 2px; }
    header .subtitle { color: var(--muted); }
    header .spacer { flex: 1; }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      margin-right: 6px;
    }
    .back-btn:hover { color: var(--text); }

    /* layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* vm list */
    .vm-list {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-top {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    .new-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .new-btn:hover { border-color: var(--accent); color: var(--accent); }

    .vm-rows { overflow-y: auto; flex: 1; }

    .vm-row {
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .vm-row:hover { background: var(--surface); }
    .vm-row.active { background: var(--surface); border-left: 2px solid var(--accent); padding-left: 18px; }

    .vm-row-left { min-width: 0; }
    .vm-row-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vm-row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.running  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    [data-theme="light"] .dot.running { box-shadow: none; }
    .dot.booting  { background: var(--warn); animation: pulse 1s infinite; }
    .dot.stopping { background: var(--warn); animation: pulse 1s infinite; }
    .dot.stopped  { background: var(--muted); }
    .dot.error    { background: var(--danger); }
    .dot.unknown  { background: var(--muted); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* detail */
    .detail-wrap { flex: 1; overflow-y: auto; }

    .empty-state {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .detail { padding: 32px 36px; max-width: 720px; }

    .detail-head {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .detail-name { font-size: 22px; font-weight: 400; }

    .detail-meta {
      color: var(--dim);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail-ip {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 24px;
    }
    .detail-ip.none { color: var(--muted); font-size: 13px; }

    hr.divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

    /* I/O */
    .io-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .io-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
    }

    .io-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .io-label { color: var(--muted); }
    .io-rate { color: var(--dim); }
    .io-rate.net  { color: var(--blue); }
    .io-rate.disk { color: var(--accent); }

    svg.spark { display: block; width: 100%; height: 40px; }
    polyline { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }

    /* disks */
    .disk-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .disk-row:first-child { border-top: 1px solid var(--border); }
    .disk-idx { color: var(--muted); width: 44px; flex-shrink: 0; }

    /* snapshots */
    .snap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--dim);
    }
    .snap-row:first-child { border-top: 1px solid var(--border); }
    .snap-none { color: var(--muted); font-size: 12px; padding: 8px 0; }

    /* section heading */
    .sh {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    /* actions */
    .act-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .act-row.top { margin-top: 18px; margin-bottom: 4px; }

    .btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 18px;
      cursor: pointer;
      min-height: 38px;
    }
    .btn:hover { border-color: var(--text); color: var(--text); }
    .btn.red:hover { border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    /* form */
    .form-wrap { padding: 32px 36px; max-width: 520px; }
    .form-title { font-size: 18px; margin-bottom: 28px; color: var(--text); }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 11px; color: var(--muted); }
    .field input, .field select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--surface); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .form-error { color: var(--danger); font-size: 12px; margin-bottom: 14px; min-height: 18px; }

    /* theme toggle button */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: var(--text); color: var(--text); }

    /* mobile */
    @media (max-width: 700px) {
      .vm-list { width: 100%; border-right: none; }
      .vm-list.hidden { display: none; }
      .detail-wrap { display: none; width: 100%; }
      .detail-wrap.visible { display: block; }
      .detail { padding: 20px; }
      .form-wrap { padding: 20px; }
      .io-row { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
      .act-row .btn { flex: 1; min-height: 46px; }
    }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="back-btn" onclick="goBack()">← back</button>
    <h1>crouton</h1>
    <span class="sep">/</span>
    <span class="subtitle" id="header-sub">cloud hypervisor</span>
    <span class="spacer"></span>
    <span id="vm-count" style="color:var(--muted);font-size:12px;margin-right:12px"></span>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☾</button>
  </header>

  <div class="layout">
    <div class="vm-list" id="vm-list">
      <div class="list-top">
        <span>VMs</span>
        <button class="new-btn" onclick="openCreate()">+ new</button>
      </div>
      <div class="vm-rows" id="vm-rows"></div>
    </div>

    <div class="detail-wrap" id="detail-wrap">
      <div id="detail-inner"><div class="empty-state"><span style="color:var(--muted)">select a vm</span></div></div>
    </div>
  </div>

  <script>
    let vms = [], images = [], selected = null;
    const history = new Map();
    const HIST = 40;
    let counterTimer = null;

    const isMobile = () => window.innerWidth <= 700;

    // formatting
    function fmtRate(bps) {
      if (bps == null || isNaN(bps) || bps < 0) return '0 B/s';
      if (bps < 1024) return bps.toFixed(0) + ' B/s';
      if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
      return (bps / 1048576).toFixed(2) + ' MB/s';
    }

    function stateEl(state) {
      return `<span class="badge"><span class="dot ${state}"></span>${state}</span>`;
    }

    // sparkline
    function sparkline(vals, color) {
      if (vals.length < 2) return `<svg class="spark"><polyline points="" stroke="${color}"/></svg>`;
      const max = Math.max(...vals, 1);
      const W = 200, H = 40;
      const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * W},${H - (v / max) * H}`).join(' ');
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <polyline points="${pts}" stroke="${color}"/></svg>`;
    }

    // counters
    async function pollCounters(name) {
      try {
        const res = await fetch(`/api/vms/${name}/counters`);
        if (!res.ok) return;
        const { ts, counters } = await res.json();

        let net_rx = 0, net_tx = 0, blk_r = 0, blk_w = 0;
        for (const [k, d] of Object.entries(counters)) {
          if (k.startsWith('_net'))  { net_rx += d.rx_bytes||0; net_tx += d.tx_bytes||0; }
          if (k.startsWith('_disk')) { blk_r  += d.read_bytes||0; blk_w += d.write_bytes||0; }
        }

        const hist = history.get(name) || [];
        hist.push({ ts, net_rx, net_tx, blk_r, blk_w });
        if (hist.length > HIST) hist.shift();
        history.set(name, hist);
        updateIO(name);
      } catch {}
    }

    function rates(name, key) {
      const h = history.get(name) || [];
      if (h.length < 2) return [];
      const out = [];
      for (let i = 1; i < h.length; i++) {
        const dt = (h[i].ts - h[i-1].ts) / 1000;
        out.push(dt > 0 ? Math.max(0, (h[i][key] - h[i-1][key]) / dt) : 0);
      }
      return out;
    }

    function updateIO(name) {
      if (selected !== name) return;
      const h = history.get(name) || [];
      if (h.length < 2) return;
      const last = h[h.length - 1], prev = h[h.length - 2];
      const dt = (last.ts - prev.ts) / 1000 || 1;
      const rx  = Math.max(0, (last.net_rx - prev.net_rx) / dt);
      const tx  = Math.max(0, (last.net_tx - prev.net_tx) / dt);
      const r   = Math.max(0, (last.blk_r  - prev.blk_r)  / dt);
      const w   = Math.max(0, (last.blk_w  - prev.blk_w)  / dt);

      const netRates = rates(name, 'net_rx').map((v,i) => v + (rates(name,'net_tx')[i]||0));
      const blkRates = rates(name, 'blk_r').map((v,i)  => v + (rates(name,'blk_w')[i]||0));

      const nc = document.getElementById('io-net');
      const bc = document.getElementById('io-blk');
      if (!nc || !bc) return;

      nc.innerHTML = `<div class="io-head"><span class="io-label">network</span><span class="io-rate net">↓${fmtRate(rx)} ↑${fmtRate(tx)}</span></div>${sparkline(netRates,'var(--blue)')}`;
      bc.innerHTML = `<div class="io-head"><span class="io-label">disk</span><span class="io-rate disk">r:${fmtRate(r)} w:${fmtRate(w)}</span></div>${sparkline(blkRates,'var(--accent)')}`;
    }

    function startPolling(name) {
      stopPolling();
      pollCounters(name);
      counterTimer = setInterval(() => pollCounters(name), 2000);
    }

    function stopPolling() {
      if (counterTimer) { clearInterval(counterTimer); counterTimer = null; }
    }

    // snapshots
    async function loadSnaps(name) {
      try { const r = await fetch(`/api/vms/${name}/snapshots`); return r.ok ? r.json() : []; } catch { return []; }
    }

    async function takeSnap(name) {
      const btn = document.getElementById('snap-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'working…'; }
      try {
        const r = await fetch(`/api/vms/${name}/snapshots`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) alert(d.error);
        else await refreshSnaps(name);
      } catch (e) { alert(e.message); }
      if (btn) { btn.disabled = false; btn.textContent = 'snapshot'; }
    }

    async function refreshSnaps(name) {
      const snaps = await loadSnaps(name);
      const el = document.getElementById('snap-list');
      if (!el) return;
      el.innerHTML = renderSnapList(snaps);
    }

    function renderSnapList(snaps) {
      if (!snaps.length) return '<div class="snap-none">no snapshots</div>';
      return snaps.map(s => `<div class="snap-row"><span>${s.replace(/_/g,' ')}</span></div>`).join('');
    }

    // list
    function renderList() {
      const rows = document.getElementById('vm-rows');
      const count = document.getElementById('vm-count');
      const running = vms.filter(v => v.state === 'running').length;
      count.textContent = `${running} / ${vms.length} running`;

      rows.innerHTML = '';
      for (const vm of vms) {
        const div = document.createElement('div');
        div.className = 'vm-row' + (selected === vm.name ? ' active' : '');
        div.innerHTML = `
          <div class="vm-row-left">
            <div class="vm-row-name">${vm.name}</div>
            <div class="vm-row-sub">${vm.config.bootMode} · ${vm.config.disks.length}d${vm.ip ? ' · ' + vm.ip : ''}</div>
          </div>
          ${stateEl(vm.state)}
        `;
        div.addEventListener('click', () => selectVM(vm.name));
        rows.appendChild(div);
      }
    }

    // detail
    async function renderDetail() {
      const inner = document.getElementById('detail-inner');
      const wrap  = document.getElementById('detail-wrap');

      if (selected === 'create') { renderForm(inner, wrap); return; }

      const vm = vms.find(v => v.name === selected);
      if (!vm) {
        stopPolling();
        inner.innerHTML = '<div class="empty-state"><span style="color:var(--muted)">select a vm</span></div>';
        return;
      }

      const alive = vm.state === 'running';
      const snaps = alive ? await loadSnaps(vm.name) : [];
      const specs = [
        vm.config.cpus   ? `${vm.config.cpus} vcpu`   : null,
        vm.config.memoryMb ? `${vm.config.memoryMb} MB` : null,
        vm.config.bootMode,
      ].filter(Boolean).join(' · ');

      inner.innerHTML = `
        <div class="detail">
          <div class="detail-head">
            <span class="detail-name">${vm.name}</span>
            ${stateEl(vm.state)}
          </div>
          <div class="detail-meta">${specs}</div>
          ${vm.ip
            ? `<div class="detail-ip">${vm.ip}<span style="color:var(--muted);font-size:12px;margin-left:14px">${vm.mac}</span></div>`
            : `<div class="detail-ip none">${vm.mac}</div>`
          }

          <div class="act-row top">
            ${alive
              ? `<button class="btn" onclick="act('${vm.name}','reboot')">reboot</button>
                 <button class="btn" onclick="act('${vm.name}','pause')">pause</button>
                 <button class="btn" id="snap-btn" onclick="takeSnap('${vm.name}')">snapshot</button>
                 <button class="btn red" onclick="act('${vm.name}','shutdown')">shutdown</button>`
              : `<button class="btn" onclick="startVm('${vm.name}')">start</button>
                 <button class="btn red" onclick="deleteVm('${vm.name}')">delete</button>`
            }
          </div>

          ${alive ? `
          <hr class="divider">
          <div class="io-row">
            <div class="io-card" id="io-net"><div class="io-head"><span class="io-label">network</span><span class="io-rate net">—</span></div>${sparkline([],'var(--blue)')}</div>
            <div class="io-card" id="io-blk"><div class="io-head"><span class="io-label">disk</span><span class="io-rate disk">—</span></div>${sparkline([],'var(--accent)')}</div>
          </div>` : ''}

          <hr class="divider">
          <div class="sh">Disks</div>
          <div id="disk-list">
            ${vm.config.disks.map((d,i) => `<div class="disk-row"><span class="disk-idx">disk${i}</span><span>${d}</span></div>`).join('')}
          </div>

          <hr class="divider">
          <div class="sh">Snapshots</div>
          <div id="snap-list">${renderSnapList(snaps)}</div>
        </div>
      `;

      if (alive) startPolling(vm.name);
      else stopPolling();
    }

    // create form
    function renderForm(inner, wrap) {
      const opts = images.map(i => `<option value="${i}">${i}</option>`).join('');
      inner.innerHTML = `
        <div class="form-wrap">
          <div class="form-title">New VM</div>
          <div class="form-error" id="form-error"></div>
          <div class="field">
            <label>Name</label>
            <input id="f-name" type="text" placeholder="my-vm" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label>Base image</label>
            <select id="f-image">${opts || '<option value="">no images found</option>'}</select>
          </div>
          <div class="field-row">
            <div class="field"><label>CPUs</label><input id="f-cpus" type="number" value="2" min="1" max="64"></div>
            <div class="field"><label>Memory (MB)</label><input id="f-memory" type="number" value="2048" min="256" step="256"></div>
          </div>
          <div class="field"><label>Disk size (GB)</label><input id="f-disk" type="number" value="25" min="1"></div>
          <div class="act-row">
            <button class="btn" id="create-btn" onclick="submitCreate()">Create & start</button>
            <button class="btn" onclick="goBack()">Cancel</button>
          </div>
        </div>
      `;
    }

    async function submitCreate() {
      const name     = document.getElementById('f-name').value.trim();
      const image    = document.getElementById('f-image').value;
      const cpus     = parseInt(document.getElementById('f-cpus').value);
      const memoryMb = parseInt(document.getElementById('f-memory').value);
      const diskSizeGb = parseInt(document.getElementById('f-disk').value);
      const err = document.getElementById('form-error');

      if (!name)  { err.textContent = 'Name is required.'; return; }
      if (!image) { err.textContent = 'Select a base image.'; return; }
      err.textContent = '';

      const btn = document.getElementById('create-btn');
      btn.disabled = true; btn.textContent = 'Provisioning…';

      try {
        const res = await fetch('/api/vms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, image, cpus, memoryMb, diskSizeGb }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error || 'Failed.'; btn.disabled = false; btn.textContent = 'Create & start'; return; }
        selected = name;
        await fetchVMs();
        if (isMobile()) document.getElementById('header-sub').textContent = name;
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false; btn.textContent = 'Create & start';
      }
    }

    // navigation
    function selectVM(name) {
      selected = name;
      renderList();
      renderDetail();
      if (isMobile()) {
        document.getElementById('vm-list').classList.add('hidden');
        document.getElementById('detail-wrap').classList.add('visible');
        document.getElementById('back-btn').style.display = 'inline';
        document.getElementById('header-sub').textContent = name;
      }
    }

    function openCreate() {
      stopPolling();
      selected = 'create';
      renderList();
      renderDetail();
      if (isMobile()) {
        document.getElementById('vm-list').classList.add('hidden');
        document.getElementById('detail-wrap').classList.add('visible');
        document.getElementById('back-btn').style.display = 'inline';
        document.getElementById('header-sub').textContent = 'New VM';
      }
    }

    function goBack() {
      stopPolling();
      selected = null;
      document.getElementById('vm-list').classList.remove('hidden');
      document.getElementById('detail-wrap').classList.remove('visible');
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('header-sub').textContent = 'cloud hypervisor';
      renderList();
      renderDetail();
    }

    async function act(name, action) {
      const res = await fetch(`/api/vms/${name}/${action}`, { method: 'PUT' });
      if (!res.ok) { const d = await res.json().catch(() => ({})); alert(d.error || 'failed'); }
      fetchVMs();
    }

    async function startVm(name) {
      const res = await fetch(`/api/vms/${name}/start`, { method: 'POST' });
      if (!res.ok) { const d = await res.json().catch(() => ({})); alert(d.error || 'failed to start'); }
      fetchVMs();
    }

    async function deleteVm(name) {
      if (!confirm(`Delete VM "${name}"?\nThis removes its disk and config permanently.`)) return;
      const res = await fetch(`/api/vms/${name}`, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json().catch(() => ({})); alert(d.error || 'failed'); return; }
      selected = null;
      goBack();
      fetchVMs();
    }

    // data
    async function fetchVMs() {
      try {
        const res = await fetch('/api/vms');
        vms = await res.json();
        if (selected && selected !== 'create' && !vms.find(v => v.name === selected)) selected = null;
        renderList();
        if (selected !== 'create') renderDetail();
      } catch {}
    }

    async function fetchImages() {
      try { const r = await fetch('/api/images'); images = await r.json(); } catch {}
    }

    // theme
    function applyTheme(t) {
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      document.getElementById('theme-toggle').textContent = t === 'light' ? '☀' : '☾';
    }

    function toggleTheme() {
      const cur = localStorage.getItem('theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    applyTheme(localStorage.getItem('theme') || 'dark');
    fetchImages();
    fetchVMs();
    setInterval(fetchVMs, 5000);
  </script>
</body>
</html>
