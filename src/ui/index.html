<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crouton</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* dark — Linear/Retool internal-tool: dense, gray + muted blue, hairline */
      --bg:      #0f1012;
      --surface: #16181b;
      --surface2:#1c1f23;
      --border:  #292c32;
      --text:    #e3e5e8;
      --muted:   #6b7079;
      --dim:     #a4a9b0;
      --accent:  #5b8def;
      --accent-soft: rgba(91, 141, 239, 0.12);
      --blue:    #5b8def;
      --chart-2: #8ea3c4;
      --warn:    #d4a93a;
      --danger:  #e0716a;
      --radius:  4px;
      --font: 'Berkeley Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    }

    [data-theme="light"] {
      /* light — clean Retool: off-white canvas, true white surfaces, cool gray borders */
      --bg:      #f7f8fa;
      --surface: #ffffff;
      --surface2:#f1f3f5;
      --border:  #e3e5e9;
      --text:    #1a1d22;
      --muted:   #6b7280;
      --dim:     #3a4148;
      --accent:  #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --blue:    #2563eb;
      --chart-2: #6b7d99;
      --warn:    #b07a00;
      --danger:  #c53030;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg);
      position: relative;
      z-index: 10;
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    header .sep { color: var(--border); margin: 0 4px; }
    header .subtitle { color: var(--muted); font-size: 12px; }
    header .spacer { flex: 1; }
    header .meta { color: var(--muted); font-size: 11px; margin-right: 12px; font-variant-numeric: tabular-nums; }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      margin-right: 6px;
    }
    .back-btn:hover { color: var(--text); }

    /* layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* vm list */
    .vm-list {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .list-top {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .new-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-family: var(--font);
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      letter-spacing: 0;
      text-transform: none;
    }
    .new-btn:hover { border-color: var(--accent); color: var(--accent); }

    .vm-rows { overflow-y: auto; flex: 1; }

    .vm-row {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: background 0.1s, border-color 0.1s;
      animation: fadein 0.25s ease-out both;
      position: relative;
    }
    .vm-row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: transparent;
      transition: background 0.15s;
    }
    .vm-row:hover { background: var(--surface); }
    .vm-row.active { background: var(--accent-soft); }
    .vm-row.active::before { background: var(--accent); }

    .vm-row-left { min-width: 0; }
    .vm-row-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vm-row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; position: relative; }
    .dot.running  { background: #3fbf6e; }
    .dot.booting  { background: var(--warn); animation: pulse 1s infinite; }
    .dot.stopping { background: var(--warn); animation: pulse 1s infinite; }
    .dot.stopped  { background: var(--muted); }
    .dot.error    { background: var(--danger); }
    .dot.unknown  { background: var(--muted); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
    @keyframes flash-ok { 0% { background: var(--accent); color: var(--bg); } 100% {} }
    @keyframes flash-err { 0% { background: var(--danger); color: var(--bg); } 100% {} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }

    /* detail */
    .detail-wrap { flex: 1; overflow-y: auto; }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 24px;
      animation: fadein 0.5s ease-out;
    }
    .empty-art {
      font-size: 14px;
      line-height: 1.25;
      color: var(--border);
      white-space: pre;
      letter-spacing: 0;
    }
    .empty-msg { font-size: 14px; color: var(--dim); }
    .empty-msg .cursor { animation: blink 1s step-end infinite; color: var(--accent); margin-left: 2px; }
    .empty-tag { font-size: 11px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

    .detail { padding: 22px 28px; max-width: 820px; }

    .detail-head {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .detail-name { font-size: 19px; font-weight: 600; letter-spacing: -0.005em; }

    .detail-ip-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 12px;
    }
    .detail-ip-row .ip { font-size: 14px; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
    .detail-ip-row .mac { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .detail-ip-row .nope { color: var(--muted); font-size: 12px; }

    /* stat grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 15px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat-value .unit { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 400; }
    .stat-value.muted { color: var(--muted); font-size: 13px; font-weight: 400; }

    hr.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

    /* I/O */
    .io-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .io-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .io-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .io-label { color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .io-rate { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
    .io-rate.net  { color: var(--accent); }
    .io-rate.disk { color: var(--chart-2); }

    svg.spark { display: block; width: 100%; height: 48px; }
    polyline.spark-line { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    polygon.spark-fill { stroke: none; }

    /* disks */
    .disk-row {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .disk-row:first-child { border-top: 1px solid var(--border); }
    .disk-idx { color: var(--muted); width: 44px; flex-shrink: 0; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    .disk-name { flex: 1; font-variant-numeric: tabular-nums; }
    .disk-size { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* snapshots */
    .snap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--dim);
    }
    .snap-row:first-child { border-top: 1px solid var(--border); }
    .snap-none { color: var(--muted); font-size: 12px; padding: 8px 0; }

    /* section heading: subtle label only */
    .sh {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* actions */
    .act-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 22px; }
    .act-row.top { margin-top: 14px; margin-bottom: 4px; }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      min-height: 28px;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      position: relative;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--dim); color: var(--text); background: var(--surface2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
    [data-theme="light"] .btn.primary { color: #fff; }
    .btn.red:hover { border-color: var(--danger); color: var(--danger); background: var(--surface); }
    .btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
    .btn.flash-ok  { animation: flash-ok 0.6s ease-out; }
    .btn.flash-err { animation: flash-err 0.6s ease-out; }
    .btn.busy { color: var(--muted); pointer-events: none; }
    .btn.busy::after {
      content: '';
      display: inline-block;
      width: 10px; height: 10px;
      margin-left: 8px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
    }

    /* form */
    .form-wrap { padding: 22px 28px; max-width: 540px; }
    .form-title { font-size: 15px; font-weight: 600; margin-bottom: 18px; color: var(--text); letter-spacing: -0.005em; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field label { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    .field input, .field select, .field textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      width: 100%;
      -webkit-appearance: none;
      resize: vertical;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field select option { background: var(--surface); color: var(--text); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .form-error { color: var(--danger); font-size: 12px; margin-bottom: 12px; min-height: 18px; }

    /* toasts */
    .toasts {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      color: var(--text);
      padding: 8px 14px;
      font-size: 12px;
      max-width: 340px;
      animation: slidein 0.25s ease-out;
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .toast.err { border-left-color: var(--danger); }
    .toast.fade { opacity: 0; transition: opacity 0.4s; }
    [data-theme="light"] .toast { box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    /* theme toggle button */
    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: var(--dim); color: var(--text); }

    /* hero stats bar — sits above the VM list */
    .hero {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .hero-cell {
      padding: 10px 14px;
      border-right: 1px solid var(--border);
    }
    .hero-cell:last-child { border-right: none; }
    .hero-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .hero-value {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .hero-value .accent { color: var(--accent); }
    .hero-value .small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
    .hero-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* progress bar inside a hero cell */
    .hero-bar {
      height: 2px;
      background: var(--surface2);
      margin-top: 6px;
      border-radius: 1px;
      overflow: hidden;
    }
    .hero-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s, background 0.3s;
    }
    .hero-bar-fill.warn { background: var(--warn); }
    .hero-bar-fill.danger { background: var(--danger); }

    /* surfaces stay flat — no shadows, hairline borders only */

    /* sparkline endpoint glow */
    circle.spark-tip {
      fill: currentColor;
      r: 2.5;
    }

    /* tabs */
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin: 14px 0 18px;
    }
    .tab {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      padding: 7px 12px 8px;
      cursor: pointer;
      position: relative;
      margin-bottom: -1px;
      border-bottom: 2px solid transparent;
      letter-spacing: 0.02em;
      transition: color 0.12s, border-color 0.12s;
    }
    .tab:hover { color: var(--dim); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    /* settings rows */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }
    .setting-row:first-child { border-top: 1px solid var(--border); }
    .setting-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .setting-label { font-size: 12px; color: var(--text); }
    .setting-hint { font-size: 11px; color: var(--muted); }
    .setting-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
      width: 110px;
      text-align: right;
      -webkit-appearance: none;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .setting-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    select.setting-input { text-align: left; padding-right: 8px; }

    .settings-warn {
      background: rgba(241, 196, 15, 0.08);
      border: 1px solid var(--warn);
      border-radius: 0;
      padding: 9px 14px;
      font-size: 12px;
      color: var(--warn);
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    [data-theme="light"] .settings-warn { background: rgba(176, 100, 0, 0.06); }

    .toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      width: 32px;
      height: 18px;
      border-radius: 9px;
      padding: 0;
      cursor: pointer;
      position: relative;
      transition: background 0.18s, border-color 0.18s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle .knob {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      transition: transform 0.18s;
    }
    .toggle.on .knob { transform: translateX(14px); background: #fff; }
    .toggle:disabled { opacity: 0.5; cursor: default; }

    /* autostart marker on list rows */
    .auto-mark {
      color: var(--accent);
      font-size: 10px;
      margin-left: 6px;
      vertical-align: 1px;
    }

    /* images view */
    .images-wrap { padding: 22px 28px; max-width: 820px; }
    .images-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.005em;
      margin-bottom: 14px;
    }
    .images-list { margin-bottom: 24px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .image-row {
      display: grid;
      grid-template-columns: 1fr 120px 100px 80px;
      gap: 12px;
      align-items: baseline;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
    }
    .image-row:last-child { border-bottom: none; }
    .image-name { font-weight: 500; font-size: 13px; }
    .image-format {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .image-format.qcow2 { color: var(--accent); border-color: var(--accent); }
    .image-format.raw, .image-format.img { color: var(--chart-2); border-color: var(--chart-2); }
    .image-format.iso { color: var(--warn); border-color: var(--warn); }
    .image-size { color: var(--muted); font-variant-numeric: tabular-nums; }
    .image-delete {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      justify-self: end;
    }
    .image-delete:hover { border-color: var(--danger); color: var(--danger); }
    .images-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 12px;
    }

    /* mobile */
    @media (max-width: 700px) {
      /* Let the page scroll naturally; nested scroll on flex children
         is fragile on mobile (no min-height:0) and fights the browser. */
      html, body { height: auto; min-height: 100%; overflow: visible; overflow-y: auto; }
      body { overflow-x: hidden; }
      header { position: sticky; top: 0; }
      .layout { overflow: visible; }

      .vm-list { width: 100%; border-right: none; overflow: visible; }
      .vm-list.hidden { display: none; }
      .vm-rows { overflow: visible; }
      .detail-wrap { display: none; width: 100%; overflow: visible; }
      .detail-wrap.visible { display: block; }
      .hero { grid-template-columns: repeat(2, 1fr); }
      .hero-cell:nth-child(2) { border-right: none; }
      .hero-cell:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .detail { padding: 22px; }
      .form-wrap { padding: 22px; }
      .detail-name { font-size: 22px; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .io-row { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
      .act-row .btn { flex: 1; min-height: 48px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { render } from "https://esm.sh/preact@10.22.0";
    import { useState, useEffect, useRef, useCallback, useMemo } from "https://esm.sh/preact@10.22.0/hooks";
    import { html } from "https://esm.sh/htm@3.1.1/preact?deps=preact@10.22.0";

    // ── constants ────────────────────────────────────────────────────────
    const HIST = 40;
    const ACTION_VERBS = {
      reboot: "rebooting",
      pause: "paused",
      resume: "resumed",
      shutdown: "shutting down",
    };

    // ── helpers ──────────────────────────────────────────────────────────
    function fmtRate(bps) {
      if (bps == null || isNaN(bps) || bps < 0) return "0 B/s";
      if (bps < 1024) return bps.toFixed(0) + " B/s";
      if (bps < 1_048_576) return (bps / 1024).toFixed(1) + " KB/s";
      return (bps / 1_048_576).toFixed(2) + " MB/s";
    }

    /** Mutates `historyMap` in place. */
    function ingestCounters(historyMap, ts, data) {
      for (const [name, counters] of Object.entries(data || {})) {
        let net_rx = 0, net_tx = 0, blk_r = 0, blk_w = 0;
        for (const [k, d] of Object.entries(counters)) {
          if (k.startsWith("_net")) { net_rx += d.rx_bytes || 0; net_tx += d.tx_bytes || 0; }
          if (k.startsWith("_disk")) { blk_r += d.read_bytes || 0; blk_w += d.write_bytes || 0; }
        }
        const hist = historyMap.get(name) ?? [];
        hist.push({ ts, net_rx, net_tx, blk_r, blk_w });
        if (hist.length > HIST) hist.shift();
        historyMap.set(name, hist);
      }
    }

    function ratesFrom(history, name) {
      const h = history.get(name) ?? [];
      if (h.length < 2) return { net: [], blk: [], current: { rx: 0, tx: 0, r: 0, w: 0 } };

      const net = [], blk = [];
      for (let i = 1; i < h.length; i++) {
        const dt = (h[i].ts - h[i - 1].ts) / 1000;
        const factor = dt > 0 ? 1 / dt : 0;
        net.push(Math.max(0, (h[i].net_rx - h[i - 1].net_rx) * factor + (h[i].net_tx - h[i - 1].net_tx) * factor));
        blk.push(Math.max(0, (h[i].blk_r - h[i - 1].blk_r) * factor + (h[i].blk_w - h[i - 1].blk_w) * factor));
      }

      const last = h[h.length - 1], prev = h[h.length - 2];
      const dt = (last.ts - prev.ts) / 1000 || 1;
      const current = {
        rx: Math.max(0, (last.net_rx - prev.net_rx) / dt),
        tx: Math.max(0, (last.net_tx - prev.net_tx) / dt),
        r: Math.max(0, (last.blk_r - prev.blk_r) / dt),
        w: Math.max(0, (last.blk_w - prev.blk_w) / dt),
      };
      return { net, blk, current };
    }

    const isMobile = () => window.innerWidth <= 700;

    async function withButton(target, fn) {
      const btn = target instanceof HTMLElement ? target : target?.currentTarget;
      btn?.classList.add("busy");
      try {
        const result = await fn();
        btn?.classList.remove("busy");
        btn?.classList.add("flash-ok");
        setTimeout(() => btn?.classList.remove("flash-ok"), 600);
        return result;
      } catch (e) {
        btn?.classList.remove("busy");
        btn?.classList.add("flash-err");
        setTimeout(() => btn?.classList.remove("flash-err"), 600);
        throw e;
      }
    }

    // ── components ───────────────────────────────────────────────────────

    function StateBadge({ state }) {
      return html`
        <span class="badge"><span class=${"dot " + state}></span>${state}</span>
      `;
    }

    function Toggle({ value, onChange, disabled }) {
      return html`
        <button class=${"toggle" + (value ? " on" : "")} disabled=${disabled} onClick=${() => onChange(!value)} aria-pressed=${value}>
          <span class="knob"></span>
        </button>
      `;
    }

    function Sparkline({ values, color, gradId }) {
      const W = 200, H = 48;
      if (values.length < 2) {
        return html`<svg class="spark" viewBox=${`0 0 ${W} ${H}`}><polyline points="" stroke=${color} /></svg>`;
      }
      const max = Math.max(...values, 1);
      const pts = values.map((v, i) => [(i / (values.length - 1)) * W, H - (v / max) * H]);
      const ptsStr = pts.map(([x, y]) => `${x},${y}`).join(" ");
      const fill = `0,${H} ${ptsStr} ${W},${H}`;
      const tip = pts[pts.length - 1];
      return html`
        <svg class="spark" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" style=${`color:${color}`}>
          <defs>
            <linearGradient id=${gradId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color=${color} stop-opacity="0.45" />
              <stop offset="100%" stop-color=${color} stop-opacity="0" />
            </linearGradient>
            <radialGradient id=${gradId + "-tip"}>
              <stop offset="0%" stop-color=${color} stop-opacity="1" />
              <stop offset="100%" stop-color=${color} stop-opacity="0" />
            </radialGradient>
          </defs>
          <polygon class="spark-fill" points=${fill} fill=${`url(#${gradId})`} />
          <polyline class="spark-line" points=${ptsStr} stroke=${color} />
          <circle cx=${tip[0]} cy=${tip[1]} r="5" fill=${`url(#${gradId + "-tip"})`} />
          <circle class="spark-tip" cx=${tip[0]} cy=${tip[1]} />
        </svg>
      `;
    }

    function Header({ subtitle, theme, onBack, onToggleTheme, showBack }) {
      return html`
        <header>
          ${showBack ? html`<button class="back-btn" style="display:inline" onClick=${onBack}>← back</button>` : null}
          <h1>crouton</h1>
          <span class="sep">/</span>
          <span class="subtitle">${subtitle}</span>
          <span class="spacer"></span>
          <button class="theme-toggle" onClick=${onToggleTheme}>${theme === "dark" ? "☾" : "☀"}</button>
        </header>
      `;
    }

    function fmtMemMb(mb) {
      if (!mb) return "0";
      if (mb < 1024) return `${mb} MB`;
      return `${(mb / 1024).toFixed(1)} GB`;
    }

    function fmtBytes(b) {
      if (!b) return "0";
      const gb = b / (1024 ** 3);
      if (gb >= 1000) return `${(gb / 1024).toFixed(1)} TB`;
      if (gb >= 1) return `${gb.toFixed(1)} GB`;
      return `${(b / (1024 ** 2)).toFixed(0)} MB`;
    }

    function barClass(ratio) {
      if (ratio >= 0.85) return " danger";
      if (ratio >= 0.65) return " warn";
      return "";
    }

    function HeroBar({ vms, host }) {
      const running = vms.filter(v => v.state === "running").length;

      const cpuPct = host ? Math.round(host.cpuUsage * 100) : 0;
      const memRatio = host && host.memTotalMb > 0 ? host.memUsedMb / host.memTotalMb : 0;
      const diskRatio = host && host.diskTotalBytes > 0
        ? 1 - (host.diskFreeBytes / host.diskTotalBytes)
        : 0;

      return html`
        <div class="hero">
          <div class="hero-cell">
            <div class="hero-label">Host CPU</div>
            <div class="hero-value">
              ${host ? cpuPct : "—"}<span class="small">%</span>
            </div>
            <div class="hero-sub">${host ? `${host.cpus} cores · ${host.loadAvg.map(n => n.toFixed(2)).join(" ")}` : ""}</div>
            <div class="hero-bar"><div class=${"hero-bar-fill" + barClass(cpuPct / 100)} style=${`width:${cpuPct}%`}></div></div>
          </div>
          <div class="hero-cell">
            <div class="hero-label">Host Memory</div>
            <div class="hero-value">
              ${host ? fmtMemMb(host.memUsedMb) : "—"}<span class="small">/ ${host ? fmtMemMb(host.memTotalMb) : "—"}</span>
            </div>
            <div class="hero-sub">${host ? `${Math.round(memRatio * 100)}% used` : ""}</div>
            <div class="hero-bar"><div class=${"hero-bar-fill" + barClass(memRatio)} style=${`width:${memRatio * 100}%`}></div></div>
          </div>
          <div class="hero-cell">
            <div class="hero-label">Fleet</div>
            <div class="hero-value">
              <span class="accent">${running}</span><span class="small">/ ${vms.length} running</span>
            </div>
            <div class="hero-sub">${vms.length === 0 ? "no VMs yet" : `${vms.length - running} stopped`}</div>
          </div>
          <div class="hero-cell">
            <div class="hero-label">VM Storage</div>
            <div class="hero-value">
              ${host ? fmtBytes(host.diskFreeBytes) : "—"}<span class="small">free</span>
            </div>
            <div class="hero-sub">${host ? `of ${fmtBytes(host.diskTotalBytes)}` : ""}</div>
            <div class="hero-bar"><div class=${"hero-bar-fill" + barClass(diskRatio)} style=${`width:${diskRatio * 100}%`}></div></div>
          </div>
        </div>
      `;
    }

    function VMRow({ vm, active, onClick }) {
      const sub = `${vm.config.bootMode} · ${vm.config.disks.length}d${vm.ip ? " · " + vm.ip : ""}`;
      const cls = ["vm-row"];
      if (active) cls.push("active");
      if (vm.state === "running") cls.push("running");
      return html`
        <div class=${cls.join(" ")} onClick=${onClick}>
          <div class="vm-row-left">
            <div class="vm-row-name">
              ${vm.name}
              ${vm.config.autostart ? html`<span class="auto-mark" title="autostarts on boot">⚡</span>` : null}
            </div>
            <div class="vm-row-sub">${sub}</div>
          </div>
          <${StateBadge} state=${vm.state} />
        </div>
      `;
    }

    function VMList({ vms, selected, onSelect, onNew, onOpenImages, hidden }) {
      return html`
        <div class=${"vm-list" + (hidden ? " hidden" : "")}>
          <div class="list-top">
            <span>VMs</span>
            <div style="display:flex;gap:8px">
              <button class="new-btn" onClick=${onOpenImages}>📦 images</button>
              <button class="new-btn" onClick=${onNew}>+ new</button>
            </div>
          </div>
          <div class="vm-rows">
            ${vms.map(vm => html`
              <${VMRow}
                key=${vm.name}
                vm=${vm}
                active=${selected === vm.name}
                onClick=${() => onSelect(vm.name)} />
            `)}
          </div>
        </div>
      `;
    }

    const EMPTY_ART = `   ╭──────╮
   │ ▒▒▒▒ │
   │ ▒▒▒▒ │
   ╰──────╯
  crouton`;

    function EmptyDetail() {
      return html`
        <div class="empty-state">
          <pre class="empty-art">${EMPTY_ART}</pre>
          <div class="empty-msg">pick a vm <span class="cursor">▎</span></div>
          <div class="empty-tag">cloud hypervisor · at home</div>
        </div>
      `;
    }

    function IOCard({ label, rateText, values, color, gradId }) {
      return html`
        <div class="io-card">
          <div class="io-head">
            <span class="io-label">${label}</span>
            <span class=${"io-rate " + (label === "network" ? "net" : "disk")}>${rateText}</span>
          </div>
          <${Sparkline} values=${values} color=${color} gradId=${gradId} />
        </div>
      `;
    }

    function ActionRow({ vm, onAct, onStart, onClone, onDelete, onSnap }) {
      const alive = vm.state === "running";
      if (alive) {
        return html`
          <div class="act-row top">
            <button class="btn primary" onClick=${e => onSnap(vm.name, e)}>📸 snapshot</button>
            <button class="btn" onClick=${e => onAct(vm.name, "reboot", e)}>reboot</button>
            <button class="btn" onClick=${e => onAct(vm.name, "pause", e)}>pause</button>
            <button class="btn red" onClick=${e => onAct(vm.name, "shutdown", e)}>shutdown</button>
          </div>
        `;
      }
      return html`
        <div class="act-row top">
          <button class="btn primary" onClick=${e => onStart(vm.name, e)}>start</button>
          <button class="btn" onClick=${e => onClone(vm.name, e)}>clone</button>
          <button class="btn red" onClick=${e => onDelete(vm.name, e)}>delete</button>
        </div>
      `;
    }

    function SettingsForm({ vm, handlers }) {
      const cfg = vm.config;
      const [cpus, setCpus] = useState(cfg.cpus ?? 2);
      const [memoryMb, setMemoryMb] = useState(cfg.memoryMb ?? 2048);
      const [bootMode, setBootMode] = useState(cfg.bootMode === "unknown" ? "uefi" : cfg.bootMode);
      const [kernelPath, setKernelPath] = useState(cfg.kernelPath ?? "");
      const [saving, setSaving] = useState(false);
      const [savedTick, setSavedTick] = useState(0);

      // Re-sync local form when the server pushes a new vm.config
      // (e.g. after another tab edits). Skip if the user is actively
      // editing — judged by `saving` flag.
      useEffect(() => {
        setCpus(cfg.cpus ?? 2);
        setMemoryMb(cfg.memoryMb ?? 2048);
        setBootMode(cfg.bootMode === "unknown" ? "uefi" : cfg.bootMode);
        setKernelPath(cfg.kernelPath ?? "");
      }, [cfg.cpus, cfg.memoryMb, cfg.bootMode, cfg.kernelPath, savedTick]);

      const dirty =
        cpus !== (cfg.cpus ?? 2) ||
        memoryMb !== (cfg.memoryMb ?? 2048) ||
        bootMode !== (cfg.bootMode === "unknown" ? "uefi" : cfg.bootMode) ||
        (bootMode === "direct" && kernelPath !== (cfg.kernelPath ?? ""));

      const save = async () => {
        setSaving(true);
        const patch = { cpus, memoryMb, bootMode };
        if (bootMode === "direct") patch.kernelPath = kernelPath;
        try {
          await handlers.onUpdateConfig(vm.name, patch);
          setSavedTick(t => t + 1);
        } finally { setSaving(false); }
      };

      const running = vm.state === "running";

      return html`
        ${running ? html`
          <div class="settings-warn">
            <span>⚠</span>
            <span>VM is running. CPU / memory / boot changes apply on next start.</span>
          </div>
        ` : null}

        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">CPUs</span>
          </div>
          <input class="setting-input" type="number" min="1" max="256"
            value=${cpus} onInput=${e => setCpus(+e.target.value)} />
        </div>

        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">Memory (MB)</span>
          </div>
          <input class="setting-input" type="number" min="64" step="64"
            value=${memoryMb} onInput=${e => setMemoryMb(+e.target.value)} />
        </div>

        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">Boot mode</span>
          </div>
          <select class="setting-input" value=${bootMode} onChange=${e => setBootMode(e.target.value)}>
            <option value="uefi">uefi</option>
            <option value="direct">direct</option>
          </select>
        </div>

        ${bootMode === "direct" ? html`
          <div class="setting-row">
            <div class="setting-text">
              <span class="setting-label">Kernel filename</span>
              <span class="setting-hint">Relative to the VM directory (e.g. <code>vmlinuz</code>).</span>
            </div>
            <input class="setting-input" type="text" style="width:180px;text-align:left"
              value=${kernelPath} onInput=${e => setKernelPath(e.target.value)} />
          </div>
        ` : null}

        <div class="setting-row">
          <div class="setting-text">
            <span class="setting-label">Autostart on boot</span>
            <span class="setting-hint">Start this VM automatically when Crouton itself starts.</span>
          </div>
          <${Toggle}
            value=${!!cfg.autostart}
            onChange=${v => handlers.onSetAutostart(vm.name, v)} />
        </div>

        <div class="act-row" style="margin-top:18px">
          <button class="btn ${dirty ? "primary" : ""}" disabled=${!dirty || saving} onClick=${save}>
            ${saving ? "Saving…" : dirty ? "Save changes" : "No changes"}
          </button>
        </div>
      `;
    }

    function VMDetail({ vm, history, handlers }) {
      const alive = vm.state === "running";
      // No useMemo: history is a stable Map ref but its *contents* mutate on
      // every WS push. Recomputing on each render is cheap (≤40 samples).
      const r = alive ? ratesFrom(history, vm.name) : null;

      const [tab, setTab] = useState("overview");
      // Reset to Overview whenever the selected VM changes.
      useEffect(() => { setTab("overview"); }, [vm.name]);

      return html`
        <div class="detail">
          <div class="detail-head">
            <span class="detail-name">${vm.name}</span>
            <${StateBadge} state=${vm.state} />
          </div>

          ${vm.ip
            ? html`
              <div class="detail-ip-row">
                <span class="ip">${vm.ip}</span>
                <span class="mac">${vm.mac}</span>
              </div>`
            : html`
              <div class="detail-ip-row">
                <span class="nope">no IP yet</span>
                <span class="mac">${vm.mac}</span>
              </div>`}

          <${ActionRow} vm=${vm} ...${handlers} />

          <div class="tabs">
            <button class=${"tab" + (tab === "overview" ? " active" : "")}
              onClick=${() => setTab("overview")}>Overview</button>
            <button class=${"tab" + (tab === "settings" ? " active" : "")}
              onClick=${() => setTab("settings")}>Settings</button>
          </div>

          ${tab === "overview" ? html`
            <div class="stat-grid">
              <${StatCard} label="vCPU" value=${vm.config.cpus} />
              <${StatCard} label="Memory" value=${vm.config.memoryMb} unit="MB" />
              <${StatCard} label="Boot" value=${vm.config.bootMode} text />
              <${StatCard} label="Disks" value=${vm.config.disks.length} />
            </div>

            ${alive && r ? html`
              <div class="sh">Live I/O</div>
              <div class="io-row">
                <${IOCard}
                  label="network"
                  rateText=${html`↓${fmtRate(r.current.rx)} ↑${fmtRate(r.current.tx)}`}
                  values=${r.net}
                  color="var(--blue)"
                  gradId="grad-net" />
                <${IOCard}
                  label="disk"
                  rateText=${`r:${fmtRate(r.current.r)} w:${fmtRate(r.current.w)}`}
                  values=${r.blk}
                  color="var(--chart-2)"
                  gradId="grad-disk" />
              </div>
            ` : null}

            <div class="sh">Disks</div>
            <div style="margin-bottom:24px">
              ${vm.config.disks.map((d, i) => html`
                <div class="disk-row" key=${i}>
                  <span class="disk-idx">disk${i}</span>
                  <span class="disk-name">${d}</span>
                </div>
              `)}
            </div>

            <div class="sh">Snapshots</div>
            <div>
              ${(vm.snapshots?.length ?? 0) === 0
                ? html`<div class="snap-none">no snapshots yet</div>`
                : vm.snapshots.map(s => html`<div class="snap-row" key=${s}><span>📸 ${s.replace(/_/g, " ")}</span></div>`)}
            </div>
          ` : html`
            <${SettingsForm} vm=${vm} handlers=${handlers} />
          `}
        </div>
      `;
    }

    function StatCard({ label, value, unit, text }) {
      const empty = value == null || value === "";
      return html`
        <div class="stat-card">
          <div class="stat-label">${label}</div>
          <div class=${"stat-value" + (empty || text ? " " : "") + (empty ? "muted" : "")}>
            ${empty ? "—" : value}${unit && !empty ? html`<span class="unit">${unit}</span>` : null}
          </div>
        </div>
      `;
    }

    const DEFAULT_CLOUD_INIT = `#cloud-config

# Grow the root partition + filesystem to fill the resized disk
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true

# Configure a swapfile
swap:
  filename: /swapfile
  size: 2G
  maxsize: 4G

package_update: true
package_upgrade: false

packages:
  - curl

# Uncomment and customise to add a user with SSH access:
# users:
#   - default
#   - name: yourname
#     groups: [sudo]
#     shell: /bin/bash
#     sudo: ['ALL=(ALL) NOPASSWD:ALL']
#     lock_passwd: true
#     ssh_authorized_keys:
#       - ssh-ed25519 AAAA... your-key-here

# runcmd:
#   - [ sh, -c, "echo provisioned" ]
`;

    function CreateForm({ images, onSubmit, onCancel }) {
      const [name, setName] = useState("");
      const [image, setImage] = useState(images[0]?.filename ?? "");
      const [cpus, setCpus] = useState(2);
      const [memory, setMemory] = useState(2048);
      const [disk, setDisk] = useState(25);
      const [cloudInit, setCloudInit] = useState(DEFAULT_CLOUD_INIT);
      const [showCloudInit, setShowCloudInit] = useState(false);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => { if (!image && images.length) setImage(images[0].filename); }, [images]);

      const submit = async () => {
        setError("");
        if (!name.trim()) { setError("Name is required."); return; }
        if (!image) { setError("Select a base image."); return; }
        setBusy(true);
        try {
          const body = {
            name: name.trim(),
            image,
            cpus,
            memoryMb: memory,
            diskSizeGb: disk,
          };
          if (cloudInit.trim()) body.cloudInit = cloudInit;
          await onSubmit(body);
        } catch (e) {
          setError(e.message);
          setBusy(false);
        }
      };

      const selectedImage = images.find(i => i.filename === image);

      return html`
        <div class="form-wrap">
          <div class="form-title">New VM</div>
          <div class="form-error ${error ? "visible" : ""}" style=${error ? null : "display:none"}>${error}</div>
          <div class="field">
            <label>Name</label>
            <input type="text" placeholder="my-vm" autocomplete="off" spellcheck=${false}
              value=${name} onInput=${e => setName(e.target.value)} />
          </div>
          <div class="field">
            <label>Base image</label>
            <select value=${image} onChange=${e => setImage(e.target.value)}>
              ${images.length === 0
                ? html`<option value="">no images found</option>`
                : images.map(i => html`
                    <option key=${i.filename} value=${i.filename}>
                      ${i.filename} — ${i.format}, ${fmtBytes(i.sizeBytes)}
                    </option>`)}
            </select>
            ${selectedImage?.virtualSizeBytes
              ? html`<div style="font-size:11px;color:var(--muted);margin-top:4px">
                  virtual size ${fmtBytes(selectedImage.virtualSizeBytes)} — disk must be ≥ this
                </div>`
              : null}
          </div>
          <div class="field-row">
            <div class="field">
              <label>CPUs</label>
              <input type="number" min="1" max="64" value=${cpus} onInput=${e => setCpus(+e.target.value)} />
            </div>
            <div class="field">
              <label>Memory (MB)</label>
              <input type="number" min="256" step="256" value=${memory} onInput=${e => setMemory(+e.target.value)} />
            </div>
          </div>
          <div class="field">
            <label>Disk size (GB)</label>
            <input type="number" min="1" value=${disk} onInput=${e => setDisk(+e.target.value)} />
          </div>

          <div class="field">
            <label style="display:flex;justify-content:space-between;align-items:center">
              <span>Cloud-init <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">— user-data, applied via seed.iso</span></span>
              <button type="button" onClick=${() => setShowCloudInit(s => !s)}
                style="background:none;border:none;color:var(--muted);font-family:var(--font);font-size:11px;cursor:pointer;letter-spacing:0.08em">
                ${showCloudInit ? "hide ▴" : "show ▾"}
              </button>
            </label>
            ${showCloudInit ? html`
              <textarea
                value=${cloudInit}
                onInput=${e => setCloudInit(e.target.value)}
                spellcheck=${false}
                style="min-height:240px;line-height:1.45;font-family:var(--font);font-size:12px;tab-size:2"
              ></textarea>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">
                hostname is auto-set from the VM name in meta-data. Leave blank to skip cloud-init entirely.
              </div>
            ` : html`
              <div style="font-size:12px;color:var(--muted);padding:8px 0">
                ${cloudInit.trim() ? "Default template loaded — click show to edit." : "Empty — no cloud-init applied."}
              </div>
            `}
          </div>

          <div class="act-row">
            <button class="btn" disabled=${busy} onClick=${submit}>${busy ? "Provisioning…" : "Create & start"}</button>
            <button class="btn" onClick=${onCancel}>Cancel</button>
          </div>
        </div>
      `;
    }

    function fmtAge(iso) {
      const t = Date.parse(iso);
      if (!t) return "";
      const s = (Date.now() - t) / 1000;
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      const d = Math.floor(s / 86400);
      if (d < 30) return `${d}d ago`;
      const mo = Math.floor(d / 30);
      if (mo < 12) return `${mo}mo ago`;
      return `${Math.floor(d / 365)}y ago`;
    }

    function ImageRow({ img, onDelete }) {
      const meta = img.virtualSizeBytes
        ? `${fmtAge(img.modifiedAt)} · virtual ${fmtBytes(img.virtualSizeBytes)}`
        : fmtAge(img.modifiedAt);
      const format = img.format || "unknown";
      return html`
        <div class="image-row">
          <div>
            <div class="image-name">${img.filename}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">${meta}</div>
          </div>
          <span class=${"image-format " + format}>${format}</span>
          <span class="image-size">${fmtBytes(img.sizeBytes)}</span>
          <button class="image-delete" onClick=${() => onDelete(img.filename)}>delete</button>
        </div>
      `;
    }

    function ImagesView({ images, onDownload, onDelete, onClose }) {
      const [url, setUrl] = useState("");
      const [filename, setFilename] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async () => {
        setError("");
        if (!url.trim()) { setError("URL is required."); return; }
        setBusy(true);
        try {
          await onDownload(url.trim(), filename.trim() || undefined);
          setUrl(""); setFilename("");
        } catch (e) { setError(e.message); }
        setBusy(false);
      };

      const list = images.length === 0
        ? html`<div class="images-empty">no images yet — paste a cloud-image URL above</div>`
        : images.map(img => html`<${ImageRow} key=${img.filename} img=${img} onDelete=${onDelete} />`);

      return html`
        <div class="images-wrap">
          <div class="images-title">Images</div>

          <div class="sh">Download from URL</div>
          ${error ? html`<div class="form-error visible">${error}</div>` : null}
          <div class="field">
            <label>Image URL</label>
            <input type="url" placeholder="https://cloud-images.ubuntu.com/.../disk.img"
              value=${url} onInput=${e => setUrl(e.target.value)} disabled=${busy} />
          </div>
          <div class="field">
            <label>Filename (optional)</label>
            <input type="text" placeholder="leave empty to use URL basename" autocomplete="off" spellcheck=${false}
              value=${filename} onInput=${e => setFilename(e.target.value)} disabled=${busy} />
          </div>
          <div class="act-row" style="margin-top:6px;margin-bottom:32px">
            <button class="btn primary" disabled=${busy} onClick=${submit}>
              ${busy ? "Downloading…" : "Download"}
            </button>
            <button class="btn" onClick=${onClose} disabled=${busy}>Close</button>
          </div>

          <div class="sh">On disk (${images.length})</div>
          <div class="images-list">${list}</div>
        </div>
      `;
    }

    function Toast({ msg, kind, fade }) {
      return html`<div class=${"toast" + (kind === "err" ? " err" : "") + (fade ? " fade" : "")}>${msg}</div>`;
    }

    function ToastList({ toasts }) {
      return html`
        <div class="toasts">
          ${toasts.map(t => html`<${Toast} key=${t.id} ...${t} />`)}
        </div>
      `;
    }

    // ── root ─────────────────────────────────────────────────────────────
    function App() {
      const [vms, setVms] = useState([]);
      const [host, setHost] = useState(null);
      const [images, setImages] = useState([]);
      const [selected, setSelected] = useState(null);
      const [theme, setTheme] = useState(localStorage.getItem("theme") || "dark");
      const [toasts, setToasts] = useState([]);
      const [, setTick] = useState(0); // forces a re-render when counters arrive
      const history = useRef(new Map());

      // ── theme ──
      useEffect(() => {
        if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
        else document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", theme);
      }, [theme]);

      // ── images ──
      const refreshImages = useCallback(async () => {
        try {
          const res = await fetch("/api/images");
          if (res.ok) setImages(await res.json());
        } catch { /* ignore — UI still functional without */ }
      }, []);

      useEffect(() => { refreshImages(); }, [refreshImages]);

      // ── ws ──
      useEffect(() => {
        let ws, alive = true;
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const connect = () => {
          if (!alive) return;
          ws = new WebSocket(`${proto}//${location.host}/ws`);
          ws.onmessage = e => {
            try {
              const msg = JSON.parse(e.data);
              if (msg.type === "vms") setVms(msg.data);
              else if (msg.type === "host") setHost(msg.data);
              else if (msg.type === "counters") {
                ingestCounters(history.current, msg.ts, msg.data);
                setTick(t => t + 1);
              }
            } catch {}
          };
          ws.onclose = () => { if (alive) setTimeout(connect, 1500); };
          ws.onerror = () => ws.close();
        };
        connect();
        return () => { alive = false; ws?.close(); };
      }, []);

      // Drop selection if the VM disappears (e.g. delete)
      useEffect(() => {
        if (selected && selected !== "create" && !vms.find(v => v.name === selected)) {
          setSelected(null);
        }
      }, [vms, selected]);

      // ── toasts ──
      const toast = useCallback((msg, kind = "ok") => {
        const id = Date.now() + Math.random();
        setToasts(ts => [...ts, { id, msg, kind, fade: false }]);
        setTimeout(() => setToasts(ts => ts.map(t => t.id === id ? { ...t, fade: true } : t)), 3500);
        setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 4000);
      }, []);

      // ── action handlers ──
      const onAct = useCallback(async (name, action, ev) => {
        try {
          await withButton(ev, async () => {
            const res = await fetch(`/api/vms/${name}/${action}`, { method: "PUT" });
            if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "failed"); }
            toast(`${name} — ${ACTION_VERBS[action] || action}`);
          });
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onStart = useCallback(async (name, ev) => {
        try {
          await withButton(ev, async () => {
            const res = await fetch(`/api/vms/${name}/start`, { method: "POST" });
            if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "failed to start"); }
            toast(`🚀 ${name} starting…`);
          });
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onDelete = useCallback(async (name, ev) => {
        if (!confirm(`Delete VM "${name}"?\nThis removes its disk and config permanently.`)) return;
        try {
          await withButton(ev, async () => {
            const res = await fetch(`/api/vms/${name}`, { method: "DELETE" });
            if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "failed"); }
            toast(`💀 ${name} deleted`);
          });
          setSelected(null);
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onClone = useCallback(async (sourceName, ev) => {
        const targetName = prompt(`Clone "${sourceName}" — name for the new VM:`);
        if (!targetName) return;
        try {
          await withButton(ev, async () => {
            const res = await fetch(`/api/vms/${sourceName}/clone`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: targetName.trim() }),
            });
            if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "clone failed"); }
            toast(`🍞 ${sourceName} → ${targetName}`);
            setSelected(targetName.trim());
          });
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onSnap = useCallback(async (name, ev) => {
        try {
          await withButton(ev, async () => {
            const res = await fetch(`/api/vms/${name}/snapshots`, { method: "POST" });
            const d = await res.json();
            if (!res.ok) throw new Error(d.error || "snapshot failed");
            toast(`📸 snapshot saved — ${d.name}`);
          });
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onSetAutostart = useCallback(async (name, value) => {
        try {
          const res = await fetch(`/api/vms/${name}/autostart`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ value }),
          });
          if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "failed"); }
          toast(value ? `⚡ ${name} — autostart on` : `${name} — autostart off`);
        } catch (e) { toast(e.message, "err"); }
      }, [toast]);

      const onUpdateConfig = useCallback(async (name, patch) => {
        const res = await fetch(`/api/vms/${name}/config`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(patch),
        });
        const data = await res.json();
        if (!res.ok) { toast(data.error || "save failed", "err"); throw new Error(data.error || "save failed"); }
        toast(`💾 ${name} saved`);
      }, [toast]);

      const onDownloadImage = useCallback(async (url, filename) => {
        const res = await fetch("/api/images", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(filename ? { url, filename } : { url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "download failed");
        toast(`⬇ ${data.filename} (${data.format})`);
        await refreshImages();
      }, [toast, refreshImages]);

      const onDeleteImage = useCallback(async (filename) => {
        if (!confirm(`Delete image "${filename}"? VMs using it as a base are not affected.`)) return;
        try {
          const res = await fetch(`/api/images/${encodeURIComponent(filename)}`, { method: "DELETE" });
          if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "failed"); }
          toast(`🗑 ${filename} deleted`);
          await refreshImages();
        } catch (e) { toast(e.message, "err"); }
      }, [toast, refreshImages]);

      const onCreate = useCallback(async (body) => {
        const res = await fetch("/api/vms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed.");
        toast(`🥖 ${body.name} is rising`);
        setSelected(body.name);
      }, [toast]);

      // ── derived ──
      const vm = useMemo(
        () => (selected && selected !== "create" ? vms.find(v => v.name === selected) ?? null : null),
        [vms, selected],
      );
      const running = vms.filter(v => v.state === "running").length;
      const subtitle = vm
        ? vm.name
        : selected === "create"
          ? "New VM"
          : selected === "images"
            ? "Images"
            : "cloud hypervisor";

      const mobile = isMobile();
      const handlers = { onAct, onStart, onClone, onDelete, onSnap, onSetAutostart, onUpdateConfig };

      return html`
        <${Header}
          subtitle=${subtitle}
          theme=${theme}
          showBack=${mobile && !!selected}
          onBack=${() => setSelected(null)}
          onToggleTheme=${() => setTheme(t => t === "dark" ? "light" : "dark")} />

        <${HeroBar} vms=${vms} host=${host} />

        <div class="layout">
          <${VMList}
            vms=${vms}
            selected=${selected}
            hidden=${mobile && !!selected}
            onSelect=${setSelected}
            onNew=${() => setSelected("create")}
            onOpenImages=${() => setSelected("images")} />

          <${ToastList} toasts=${toasts} />

          <div class=${"detail-wrap" + (mobile && selected ? " visible" : "")}>
            ${selected === "create"
              ? html`<${CreateForm} images=${images} onSubmit=${onCreate} onCancel=${() => setSelected(null)} />`
              : selected === "images"
                ? html`<${ImagesView}
                    images=${images}
                    onDownload=${onDownloadImage}
                    onDelete=${onDeleteImage}
                    onClose=${() => setSelected(null)} />`
                : vm
                  ? html`<${VMDetail} vm=${vm} history=${history.current} handlers=${handlers} />`
                  : html`<${EmptyDetail} />`}
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById("app"));
  </script>
</body>
</html>
